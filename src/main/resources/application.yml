spring:
  application:
    name: certforge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/certforge}
    username: ${DB_USER:certforge}
    password: ${DB_PASSWORD:certforge}
  flyway:
    enabled: true
    # Pinned on purpose. Without it Flyway uses the connection's current schema, and PostgreSQL's
    # default search path puts a schema named like the database user first. With the documented
    # user "certforge", the schema "certforge" created by V1 would become the current schema after
    # the first start, and Flyway would look for its history table there instead of in public.
    default-schema: public
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    # Off on purpose. ProblemAdvice is the one place that builds error bodies, and it extends the
    # framework's own handler. The automatic one Spring Boot adds when this is on answers first for
    # the failures raised before a controller runs (unknown path, wrong method or content type) and
    # leaves out the stable code and the request id.
    problemdetails:
      enabled: false
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: certforge.identity_session

server:
  shutdown: graceful

certforge:
  identity:
    # Session cookie Secure flag. Leave empty to follow the request scheme; set to true when
    # TLS is terminated by a proxy in front of the app.
    secure-cookie: ${SESSION_COOKIE_SECURE:}
    throttle:
      login-failures-per-email: 5
      login-failures-per-ip: 50
      window: 15m
      registrations-per-ip: 10
    # Optional first administrator, created only when no administrator exists.
    bootstrap-admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        # health and info are public; everything else requires the OPERATIONS_VIEW permission.
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      # Never reveal details publicly. Only component names and their status are shown, and only
      # for the two probe groups below.
      show-details: never
      group:
        # Liveness: is the process itself alive. It never looks at the database, so a database
        # outage does not make an orchestrator restart healthy instances.
        liveness:
          include: livenessState
          show-components: always
        # Readiness: can this instance do useful work now (database reachable, schema migrated).
        readiness:
          include: readinessState,db,flywayMigrations
          show-components: always

logging:
  pattern:
    # Correlates every log line of a request. Set LOGGING_STRUCTURED_FORMAT_CONSOLE=logstash (or ecs)
    # for JSON logs; the request id is then a field of each entry.
    correlation: "[%X{requestId:-}] "
  logback:
    rollingpolicy:
      # Bounded retention. These apply when file logging is enabled with logging.file.name.
      max-history: 14
      max-file-size: 50MB
      total-size-cap: 1GB

springdoc:
  api-docs:
    # The OpenAPI contract is generated by a test and committed (web/openapi.json). It is not served
    # in production, so it adds no public surface.
    enabled: false
  swagger-ui:
    enabled: false
