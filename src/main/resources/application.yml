spring:
  application:
    name: certforge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/certforge}
    username: ${DB_USER:certforge}
    password: ${DB_PASSWORD:certforge}
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
