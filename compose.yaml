services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: certforge
      POSTGRES_USER: certforge
      POSTGRES_PASSWORD: certforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certforge -d certforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - certforge-postgres:/var/lib/postgresql/data

volumes:
  certforge-postgres:
