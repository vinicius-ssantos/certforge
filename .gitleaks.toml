# Secret scanning configuration (gitleaks). The default rules stay on; this adds one narrow
# exception rather than disabling a rule or skipping files.
[extend]
useDefault = true

[[allowlists]]
description = "The documentation names the Idempotency-Key request header, which the generic API-key rule mistakes for a credential. It is a client-chosen retry token, not a secret."
regexes = ['''Idempotency-Key:?\s''']
paths = ['''docs(-pt-br)?/architecture/answer-submission\.md''']

[[allowlists]]
description = "A historical Java exception-override review note says 'key: quietThrows=0'; this is test output, not an API credential. Restrict exemption to that literal and that documentation file."
regexes = ['''key: `quietThrows=0`''']
paths = ['''docs/release/review-triage\.md''']
