# A release-like environment: the backend and the web app as images, PostgreSQL, and nothing else.
# Not for development (use compose.yaml and the dev servers for that). Required settings have no
# defaults on purpose, so a missing secret stops the start instead of running with a known one:
#
#   DB_PASSWORD=... BOOTSTRAP_ADMIN_EMAIL=... BOOTSTRAP_ADMIN_PASSWORD=... \
#     docker compose -f compose.release.yaml up --build
#
# See docs/engineering/release-environment.md.
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: certforge
      POSTGRES_USER: certforge
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certforge -d certforge"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      # PostgreSQL 18 images keep the version-specific directory below /var/lib/postgresql.
      - certforge-release-data:/var/lib/postgresql

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/certforge
      DB_USER: certforge
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # The session cookie is Secure when the site is served over HTTPS. Leave unset (follow the
      # request) only when trying the stack on plain http locally.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      # Behind the web container the client address arrives in X-Forwarded-For, which that
      # container overwrites. Without this every client would share one rate-limit bucket.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    # The backend is reachable from the host only, for health checks and operations.
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build: ./web
    depends_on:
      - app
    ports:
      - "${WEB_PORT:-8081}:8080"

volumes:
  certforge-release-data:
