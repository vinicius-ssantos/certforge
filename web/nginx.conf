# One origin for the app and the API.
#
# The security headers are set once, at server level, and no location below may use add_header
# (nginx would then drop every server-level header for that location). Caching is done with
# `expires`, which does not have that problem.

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The API. X-Forwarded-For is overwritten, never appended to: the backend trusts it to tell
    # clients apart for rate limiting, so a client must not be able to supply its own.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Operations endpoints are not part of the public surface.
    location /actuator/ {
        return 404;
    }

    # Built assets carry a content hash in their name and can be cached for good.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Everything else is the single-page app; its router handles the path.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
