name: Temporary API contract refresh

on:
  push:
    branches:
      - feat/mock-exam-api-clean

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/mock-exam-api-clean
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Format Java
        run: ./mvnw --batch-mode --no-transfer-progress spotless:apply
      - name: Regenerate OpenAPI contract
        run: ./mvnw --batch-mode --no-transfer-progress -Dopenapi.update=true -Dit.test=OpenApiContractIT verify
      - name: Regenerate TypeScript API types
        working-directory: web
        run: |
          npm ci
          npm run api:generate
      - name: Commit generated files
        run: |
          if git diff --quiet; then
            echo "Nothing to update"
            exit 0
          fi
          git config user.name "certforge-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src web/openapi.json web/src/api/schema.d.ts
          git commit -m "chore: refresh mock exam API contract"
          git push origin HEAD:feat/mock-exam-api-clean
