name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Java 25 / Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Show toolchain
        run: |
          java -version
          mvn --version

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify

  web:
    name: Web / lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check, including the end-to-end tests
        run: npm run typecheck

      - name: API types match the contract
        run: npm run api:check

      - name: Unit and accessibility tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end / Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: certforge
          POSTGRES_USER: certforge
          POSTGRES_PASSWORD: certforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U certforge -d certforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package the backend
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      # The fixtures go through the editorial workflow with one account acting as author, reviewer
      # and publisher, so reviewer separation is relaxed for this throwaway database only.
      - name: Start the backend
        env:
          BOOTSTRAP_ADMIN_EMAIL: e2e-admin@example.com
          BOOTSTRAP_ADMIN_PASSWORD: e2e-admin-password-123
        run: |
          nohup java -jar target/certforge-*.jar \
            --certforge.question-bank.require-reviewer-separation=false \
            --certforge.identity.throttle.registrations-per-ip=1000 \
            > backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health/readiness > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready"
          cat backend.log
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Install the browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build the web app
        working-directory: web
        run: npm run build

      - name: Run the end-to-end tests
        working-directory: web
        run: npm run e2e

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: |
            web/playwright-report
            web/test-results
            backend.log
          retention-days: 7
