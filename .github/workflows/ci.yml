name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Java 25 / Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Show toolchain
        run: |
          java -version
          mvn --version

      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

  web:
    name: Web / lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check, including the end-to-end tests
        run: npm run typecheck

      - name: API types match the contract
        run: npm run api:check

      - name: Unit and accessibility tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Size budget
        run: npm run budget

      # The packet a reviewer works from is generated from the question pack; it must match it.
      - name: Content review packet is current
        working-directory: .
        run: |
          node content/build-review-packet.mjs --out "$RUNNER_TEMP/packet.md"
          diff docs/release/content-review-packet.md "$RUNNER_TEMP/packet.md"

      # Fails on a known high or critical advisory in anything that ships to the browser.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end / Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: certforge
          POSTGRES_USER: certforge
          POSTGRES_PASSWORD: certforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U certforge -d certforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package the backend
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      # The fixtures go through the editorial workflow with one account acting as author, reviewer
      # and publisher, so reviewer separation is relaxed for this throwaway database only.
      - name: Start the backend
        env:
          BOOTSTRAP_ADMIN_EMAIL: e2e-admin@example.com
          BOOTSTRAP_ADMIN_PASSWORD: e2e-admin-password-123
        run: |
          nohup java -jar target/certforge-*.jar \
            --certforge.question-bank.require-reviewer-separation=false \
            --certforge.identity.throttle.registrations-per-ip=1000 \
            > backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health/readiness > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready"
          cat backend.log
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Install the browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build the web app
        working-directory: web
        run: npm run build

      - name: Run the end-to-end tests
        working-directory: web
        run: npm run e2e

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: |
            web/playwright-report
            web/test-results
            backend.log
          retention-days: 7

  secrets:
    name: Secret scan / whole history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The default rules plus one narrow exception documented in .gitleaks.toml.
      - name: Scan the history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect             --source /repo --config /repo/.gitleaks.toml --no-banner --redact

  release:
    name: Release images / scan, checks and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: certforge-release
      DB_PASSWORD: ci-release-password-not-a-secret
      BOOTSTRAP_ADMIN_EMAIL: e2e-admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: e2e-admin-password-123

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the release images
        run: docker compose -f compose.release.yaml build

      # Fixable high and critical findings fail the build. A new advisory can therefore fail an
      # unrelated change; the fix is nearly always a version bump (see docs/engineering/release-environment.md).
      - name: Scan the images
        run: |
          for image in certforge-release-app certforge-release-web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 image \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done

      - name: Start the release stack
        run: |
          docker compose -f compose.release.yaml up -d
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health/readiness > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f compose.release.yaml logs
          exit 1

      - name: Check the proxy, headers and rate-limit trust
        run: bash deploy/verify-release.sh

      # The end-to-end tests need the fixtures and many registrations from one address, which the
      # release settings refuse. compose.e2e.yaml relaxes exactly those two on a fresh database.
      - name: Restart for the end-to-end tests
        run: |
          docker compose -f compose.release.yaml down -v
          docker compose -f compose.release.yaml -f compose.e2e.yaml up -d
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health/readiness > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f compose.release.yaml -f compose.e2e.yaml logs
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Install the browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end tests against the release images
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8081
        run: npm run e2e

      # One learner, sequential, against budgets several times the baseline measured on a developer
      # machine, so a slow shared runner does not fail them but a real regression does.
      - name: Measure the performance baseline
        run: |
          docker compose -f compose.release.yaml -f compose.e2e.yaml logs --no-color app > app-start.log
          node deploy/measure-baseline.mjs --rounds 20 --startup-log app-start.log --enforce | tee baseline.md

      # Backs up the database that has just seen all that traffic, restores it into a new PostgreSQL
      # and compares every table.
      - name: Rehearse backup and restore
        run: bash deploy/rehearse-restore.sh -f compose.release.yaml -f compose.e2e.yaml

      # After real traffic has gone through the stack: errors keep to the contract and leak nothing,
      # metrics carry no ids or addresses, and the logs hold no answers, passwords or cookies.
      - name: Inspect errors, metrics and logs
        env:
          E2E_BASE_URL: http://localhost:8081
        run: |
          docker compose -f compose.release.yaml -f compose.e2e.yaml logs --no-color app > app.log
          node deploy/verify-privacy.mjs --logs app.log

      - name: Keep the reports and logs of a failed run
        if: failure()
        run: |
          mkdir -p release-logs
          docker compose -f compose.release.yaml -f compose.e2e.yaml logs --no-color > release-logs/compose.log 2>&1 || true

      - name: Upload the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-failure
          path: |
            web/playwright-report
            web/test-results
            release-logs
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose -f compose.release.yaml -f compose.e2e.yaml down -v
